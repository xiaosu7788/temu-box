services:
  db:
    profiles: ["internal-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temubox}
      POSTGRES_USER: ${POSTGRES_USER:-temubox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${TEMUBOX_BACKEND_IMAGE:-ghcr.io/xiaosu7788/temu-box-backend:latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8089
      TEMUBOX_DATA_DIR: /app/data
      INVENTORY_PATH: /app/data/inventories/库存统计表.xlsx
      PRICE_CACHE_PATH: /app/data/price_cache.json
      HALF_HEADCOST_PATH: /app/data/half_headcost_skus.json
      HALF_HEADCOST_SEED_PATH: /app/data/头程减半初始名单.xlsx
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-temubox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-temubox}}
      # 生产环境 schema 由 Alembic 独占管理（启动前已执行 alembic upgrade head），禁用运行时建表
      TEMUBOX_AUTO_CREATE_TABLES: "0"
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env.docker 中设置 AUTH_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env.docker 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TASK_WORKERS: ${TASK_WORKERS:-2}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-21600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      # 一键热更新：后端以管理员身份代理调用 compose ops profile 里的运维边车
      UPDATER_URL: ${UPDATER_URL:-http://updater:8899}
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/api/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12

  frontend:
    image: ${TEMUBOX_FRONTEND_IMAGE:-ghcr.io/xiaosu7788/temu-box-frontend:latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy

  # 运维边车：把「拉代码 → 拉镜像 → 重启 → 健康检查」交给后台页面执行。
  # 只在显式启用 ops profile 时启动：docker compose --profile ops up -d updater
  # 常规部署（docker-deploy.sh / docker-update-pull.sh）不带 profile，因此不会启动它；
  # 它自己也不在热更新的维护范围内（更新时绝不重建自己）。
  updater:
    profiles: ["ops"]
    image: temubox-updater:local
    build:
      context: .
      dockerfile: docker/updater.Dockerfile
    restart: unless-stopped
    environment:
      PROJECT_DIR: ${TEMUBOX_PROJECT_DIR:-/var/www/temu-box}
      UPDATER_BRANCH: ${UPDATER_BRANCH:-main}
      # 留空 = 不启用一键热更新：边车会拒绝启动，后台页面显示未配置
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      UPDATER_STATE_DIR: /var/lib/temubox-updater
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 关键：项目目录挂到容器内的同一绝对路径，compose 里的相对路径才会解析到同一位置
      - ${TEMUBOX_PROJECT_DIR:-/var/www/temu-box}:${TEMUBOX_PROJECT_DIR:-/var/www/temu-box}
      # 回滚点与任务结果放在命名卷里，边车自身被重建也不会丢
      - updater_state:/var/lib/temubox-updater
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  updater_state:
