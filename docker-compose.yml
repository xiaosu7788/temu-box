services:
  db:
    profiles: ["internal-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temubox}
      POSTGRES_USER: ${POSTGRES_USER:-temubox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8089
      TEMUBOX_DATA_DIR: /app/data
      INVENTORY_PATH: /app/data/inventories/库存统计表.xlsx
      PRICE_CACHE_PATH: /app/data/price_cache.json
      HALF_HEADCOST_PATH: /app/data/half_headcost_skus.json
      HALF_HEADCOST_SEED_PATH: /app/data/头程减半初始名单.xlsx
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-temubox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-temubox}}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env.docker 中设置 AUTH_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env.docker 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TASK_WORKERS: ${TASK_WORKERS:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/api/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8089}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
